<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کافه گردی - راهنمای دم کردن قهوه</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Vazirmatn', sans-serif;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0"
  }
}
</script>
<!-- افزودن مترجم Babel برای اجرای کدهای JSX در مرورگر -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
  <body>
    <div id="root"></div>
    <!-- تمام کدهای جاوااسکریپت در اینجا ادغام شده‌اند -->
    <script type="text/babel" data-type="module">
import React, { useState, useCallback, useEffect } from 'react';
import ReactDOM from 'react-dom/client';
import { GoogleGenAI, Type } from "@google/genai";

// =================================================================
// SERVICES
// =================================================================

const ai = new GoogleGenAI({ apiKey: process.env.API_KEY });

const recipeSchema = {
  type: Type.ARRAY,
  items: {
    type: Type.OBJECT,
    properties: {
      name: {
        type: Type.STRING,
        description: 'نام رسپی قهوه',
      },
      origin: {
        type: Type.STRING,
        description: 'کشور یا منطقه مبدأ رسپی',
      },
      description: {
        type: Type.STRING,
        description: 'توضیح کوتاه و جذاب در مورد رسپی',
      },
      ingredients: {
        type: Type.ARRAY,
        items: {
          type: Type.STRING,
        },
        description: 'لیست مواد لازم برای تهیه قهوه',
      },
      instructions: {
        type: Type.ARRAY,
        items: {
          type: Type.STRING,
        },
        description: 'مراحل تهیه قهوه به صورت گام به گام',
      },
    },
    required: ['name', 'origin', 'description', 'ingredients', 'instructions'],
  },
};

const countryListSchema = {
    type: Type.ARRAY,
    items: { type: Type.STRING },
    description: "لیستی از نام کشورها"
};

const fetchCoffeeRecipes = async (prompt) => {
  try {
    const response = await ai.models.generateContent({
      model: "gemini-2.5-flash",
      contents: prompt,
      config: {
        responseMimeType: "application/json",
        responseSchema: recipeSchema,
      },
    });

    const jsonText = response.text.trim();
    const recipes = JSON.parse(jsonText);
    return recipes;
  } catch (error) {
    console.error("Error fetching recipes from Gemini API:", error);
    throw new Error("متاسفانه در دریافت دستورالعمل‌ها از هوش مصنوعی مشکلی پیش آمد. لطفا دوباره تلاش کنید.");
  }
};

const fetchCountryList = async (prompt) => {
    try {
        const response = await ai.models.generateContent({
            model: "gemini-2.5-flash",
            contents: prompt,
            config: {
                responseMimeType: "application/json",
                responseSchema: countryListSchema,
            },
        });
        const jsonText = response.text.trim();
        const countries = JSON.parse(jsonText);
        return countries;
    } catch (error) {
        console.error("Error fetching country list from Gemini API:", error);
        throw new Error("متاسفانه در دریافت لیست کشورها از هوش مصنوعی مشکلی پیش آمد. لطفا دوباره تلاش کنید.");
    }
};

// =================================================================
// ICONS
// =================================================================

const CoffeeBeanIcon = ({ className }) => (
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="currentColor"
    className={className}
  >
    <path d="M14.5,3.5a5.1,5.1,0,0,0-5,5.2,8.2,8.2,0,0,0-1.8,5.1,6.3,6.3,0,0,0,6.3,6.2,6.3,6.3,0,0,0,6.3-6.2,8.2,8.2,0,0,0-1.8-5.1A5.1,5.1,0,0,0,14.5,3.5Zm3.3,9.5a4.3,4.3,0,0,1-4.3,4.2,4.3,4.3,0,0,1-4.3-4.2,6,6,0,0,1,1-3.3,6.2,6.2,0,0,1,3.2-2.3,6.2,6.2,0,0,1,3.2,2.3A6,6,0,0,1,17.8,13Z" />
    <path d="M9.1,3.4A5.1,5.1,0,0,0,4,8.6a8.2,8.2,0,0,0-1.8,5.1,6.3,6.3,0,0,0,6.3,6.2,6.3,6.3,0,0,0,2-0.4,8.1,8.1,0,0,1-1.2-4.1,6.3,6.3,0,0,1,3.2-5.4A5.2,5.2,0,0,0,9.1,3.4Z" />
  </svg>
);

const WorldIcon = ({ className }) => (
    <svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" />
    </svg>
);

const ArrowRightIcon = ({ className }) => (
  <svg xmlns="http://www.w3.org/2000/svg" className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
      <path strokeLinecap="round" strokeLinejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
  </svg>
);

// =================================================================
// COMPONENTS
// =================================================================

const LoadingSpinner = () => {
  return (
    <div className="flex flex-col items-center justify-center space-y-4 my-8">
      <div className="relative">
        <div className="w-20 h-20 border-4 border-dashed rounded-full animate-spin border-[#A27B5C]"></div>
        <CoffeeBeanIcon className="absolute top-1/2 left-1/2 w-10 h-10 -translate-x-1/2 -translate-y-1/2 text-[#4A2C2A]" />
      </div>
      <p className="text-[#4A2C2A] text-lg font-semibold animate-pulse">
        در حال آماده‌سازی بهترین رسپی‌ها...
      </p>
    </div>
  );
};

const CountryCard = ({ countryName, onSelect, index }) => {
  const animationDelay = `${index * 80}ms`;

  return (
    <div
      onClick={onSelect}
      className="bg-white/50 backdrop-blur-sm rounded-2xl shadow-lg p-6 text-center group transform hover:-translate-y-2 transition-all duration-300 ease-in-out cursor-pointer animate-fade-in-up flex flex-col items-center justify-center h-48"
      style={{ animationDelay }}
    >
      <WorldIcon className="w-16 h-16 text-[#A27B5C] mb-4 transition-transform duration-300 group-hover:scale-110" />
      <h3 className="text-xl font-bold text-[#4A2C2A]">{countryName}</h3>
    </div>
  );
};

const RecipeCard = ({ recipe, onView, index }) => {
  const animationDelay = `${index * 100}ms`;
  const imageUrl = `https://source.unsplash.com/400x300/?${encodeURIComponent(recipe.name)},${encodeURIComponent(recipe.origin)},coffee`;

  return (
    <div
      className="bg-white/50 backdrop-blur-sm rounded-2xl shadow-lg overflow-hidden group transform hover:-translate-y-2 transition-all duration-300 ease-in-out animate-fade-in-up"
      style={{ animationDelay }}
    >
      <div className="h-48 bg-cover bg-center" style={{ backgroundImage: `url(${imageUrl})` }}>
         <div className="w-full h-full bg-black/30 flex items-end p-4">
             <h3 className="text-white text-2xl font-bold">{recipe.name}</h3>
         </div>
      </div>
      <div className="p-6">
        <span className="inline-block bg-[#A27B5C] text-white px-3 py-1 text-sm font-semibold rounded-full mb-4">
          {recipe.origin}
        </span>
        <p className="text-[#4A2C2A] text-base mb-6 h-20 overflow-hidden">
          {recipe.description}
        </p>
        <button
          onClick={onView}
          className="w-full bg-[#4A2C2A] text-white font-bold py-3 px-4 rounded-lg hover:bg-[#382220] transform group-hover:scale-105 transition-all duration-300"
        >
          مشاهده دستورالعمل
        </button>
      </div>
    </div>
  );
};

const RecipeModal = ({ recipe, onClose }) => {
  useEffect(() => {
    const handleEsc = (event) => {
      if (event.key === 'Escape') {
        onClose();
      }
    };
    window.addEventListener('keydown', handleEsc);
    return () => {
      window.removeEventListener('keydown', handleEsc);
    };
  }, [onClose]);

  if (!recipe) return null;

  return (
    <div
      className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-fade-in"
      onClick={onClose}
    >
      <div
        className="bg-[#DCD7C9] text-[#4A2C2A] rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto transform animate-scale-in"
        onClick={(e) => e.stopPropagation()}
      >
        <div className="p-8 sticky top-0 bg-[#DCD7C9] border-b border-[#A27B5C]/50 flex justify-between items-center">
          <div>
            <h2 className="text-3xl font-bold text-[#4A2C2A]">{recipe.name}</h2>
            <p className="text-[#A27B5C] font-semibold">{recipe.origin}</p>
          </div>
          <button
            onClick={onClose}
            className="text-[#4A2C2A] hover:text-red-500 transition-colors text-3xl font-bold"
          >
            &times;
          </button>
        </div>
        
        <div className="p-8">
          <p className="text-lg mb-8 leading-relaxed">{recipe.description}</p>

          <div className="mb-8">
            <h3 className="text-2xl font-bold mb-4 border-b-2 border-[#A27B5C] pb-2">مواد لازم</h3>
            <ul className="list-disc list-inside space-y-2">
              {recipe.ingredients.map((ingredient, index) => (
                <li key={index} className="text-base">{ingredient}</li>
              ))}
            </ul>
          </div>

          <div>
            <h3 className="text-2xl font-bold mb-4 border-b-2 border-[#A27B5C] pb-2">دستورالعمل</h3>
            <ol className="space-y-4">
              {recipe.instructions.map((step, index) => (
                <li key={index} className="flex items-start">
                  <span className="flex-shrink-0 bg-[#4A2C2A] text-white rounded-full w-8 h-8 flex items-center justify-center font-bold mr-4 ml-2">
                    {index + 1}
                  </span>
                  <span className="pt-1">{step}</span>
                </li>
              ))}
            </ol>
          </div>
        </div>
      </div>
    </div>
  );
};

const App = () => {
  const [recipes, setRecipes] = useState([]);
  const [countries, setCountries] = useState([]);
  const [selectedRecipe, setSelectedRecipe] = useState(null);
  const [isLoading, setIsLoading] = useState(false);
  const [error, setError] = useState(null);
  const [viewState, setViewState] = useState('initial');
  const [listTitle, setListTitle] = useState('');

  const handleFetchClassicRecipes = useCallback(async () => {
    setIsLoading(true);
    setError(null);
    setRecipes([]);
    const prompt = "لطفاً دستورالعمل‌های دقیق برای انواع قهوه‌های محبوب کافه‌ها را ارائه دهید. برای هر کدام، نام، مبدأ (مثلاً «ایتالیایی»)، توضیحی کوتاه و جذاب، لیست مواد لازم و دستورالعمل گام به گام را بیاورید. لطفاً حداقل ۱۲ رسپی از جمله اسپرسو، آمریکانو، لاته، کاپوچینو، ماکیاتو، موکا، فلت وایت، آیس لاته، آیس موکا، کلد برو و آفوگاتو را پوشش دهید. پاسخ باید به زبان فارسی و در قالب JSON مطابق با اسکیمای ارائه شده باشد.";
    try {
      setListTitle('مرجع رسپی‌های کلاسیک');
      const fetchedRecipes = await fetchCoffeeRecipes(prompt);
      setRecipes(fetchedRecipes);
      setViewState('recipeList');
    } catch (err) {
      if (err instanceof Error) { setError(err.message); } 
      else { setError("یک خطای ناشناخته رخ داده است."); }
    } finally {
      setIsLoading(false);
    }
  }, []);

  const handleFetchCountries = useCallback(async () => {
    setIsLoading(true);
    setError(null);
    setCountries([]);
    const prompt = "یک لیست از ۱۲ کشور که به خاطر فرهنگ قهوه خاص خودشان معروف هستند را ارائه بده. کشورهایی مانند ایتالیا، ترکیه، ویتنام، برزیل، کلمبیا، اتیوپی، اتریش، ایرلند، مکزیک، کوبا، اندونزی و یونان. پاسخ باید فقط یک آرایه JSON از نام کشورها به زبان فارسی باشد.";
    try {
        const fetchedCountries = await fetchCountryList(prompt);
        setCountries(fetchedCountries);
        setViewState('countrySelection');
    } catch (err) {
        if (err instanceof Error) { setError(err.message); } 
        else { setError("یک خطای ناشناخته رخ داده است."); }
    } finally {
        setIsLoading(false);
    }
  }, []);

  const handleSelectCountry = useCallback(async (country) => {
    setIsLoading(true);
    setError(null);
    setRecipes([]);
    const prompt = `لطفا ۴ تا ۶ دستورالعمل محبوب و خاص برای تهیه قهوه یا نوشیدنی‌های گرم از کشور ${country} ارائه بده. برای هر کدام نام، کشور مبدا (${country})، توضیحی کوتاه و جذاب، لیست مواد لازم و دستورالعمل گام به گام را بیاور. پاسخ به زبان فارسی و در قالب JSON طبق اسکیمای ارائه شده باشد.`;
    try {
        setListTitle(`رسپی‌های محبوب در ${country}`);
        const fetchedRecipes = await fetchCoffeeRecipes(prompt);
        setRecipes(fetchedRecipes);
        setViewState('recipeList');
    } catch (err) {
        if (err instanceof Error) { setError(err.message); } 
        else { setError("یک خطای ناشناخته رخ داده است."); }
    } finally {
        setIsLoading(false);
    }
  }, []);
  
  const handleViewRecipe = (recipe) => {
    setSelectedRecipe(recipe);
  };

  const handleCloseModal = () => {
    setSelectedRecipe(null);
  };

  const handleGoBack = () => {
    setError(null);
    if (viewState === 'recipeList' && countries.length > 0) {
        setRecipes([]);
        setViewState('countrySelection');
    } else {
        setRecipes([]);
        setCountries([]);
        setViewState('initial');
    }
  };
  
  const getBackButtonText = () => {
    if(viewState === 'recipeList' && countries.length > 0) return 'بازگشت به لیست کشورها';
    if(viewState === 'countrySelection') return 'بازگشت به صفحه اصلی';
    if(viewState === 'recipeList') return 'بازگشت به صفحه اصلی';
    return '';
  }

  return (
    <div className="bg-[#DCD7C9] min-h-screen text-[#4A2C2A]">
      <style>{`
        @keyframes fade-in { 0% { opacity: 0; } 100% { opacity: 1; } }
        .animate-fade-in { animation: fade-in 0.5s ease-in-out forwards; }
        @keyframes fade-in-up { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { opacity: 0; animation: fade-in-up 0.5s ease-in-out forwards; }
        @keyframes scale-in { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-scale-in { animation: scale-in 0.3s ease-in-out forwards; }
      `}</style>

      <header className="py-6 px-4 text-center bg-[#4A2C2A]/10 backdrop-blur-sm flex flex-col items-center">
        <div className="w-20 h-20 bg-[#4A2C2A] rounded-full flex items-center justify-center mb-4 shadow-lg animate-fade-in">
          <CoffeeBeanIcon className="w-12 h-12 text-[#DCD7C9]" />
        </div>
        <h1 className="text-5xl font-bold text-[#4A2C2A]">
          کافه گردی
        </h1>
        <p className="mt-2 text-lg text-[#A27B5C]">
          دنیای قهوه را مانند یک باریستای حرفه‌ای کشف کنید
        </p>
      </header>

      <main className="container mx-auto p-4 md:p-8">
        {viewState !== 'initial' && !isLoading && (
            <div className="text-center mb-8 animate-fade-in">
                <button
                    onClick={handleGoBack}
                    className="group relative inline-flex items-center justify-center px-6 py-3 font-bold text-[#4A2C2A] transition-all duration-300 ease-in-out bg-white/60 rounded-lg shadow-md hover:bg-white overflow-hidden"
                >
                    <span className="absolute top-0 right-0 w-0 h-full transition-all duration-300 ease-in-out bg-[#A27B5C] group-hover:w-full"></span>
                    <span className="relative z-10 flex items-center gap-2 transition-colors duration-300 group-hover:text-white">
                        <ArrowRightIcon className="w-5 h-5 transition-transform duration-300 group-hover:translate-x-1" />
                        {getBackButtonText()}
                    </span>
                </button>
            </div>
        )}
        
        {viewState === 'initial' && (
          <div className="text-center py-16 animate-fade-in-up">
            <h2 className="text-4xl font-bold mb-4">به کافه گردی خوش آمدید!</h2>
            <p className="text-xl mb-8 max-w-2xl mx-auto">
              انتخاب کنید که مایل به دیدن کدام دستورالعمل‌ها هستید.
            </p>
            <div className="flex flex-col sm:flex-row gap-4 justify-center">
                <button
                    onClick={handleFetchClassicRecipes}
                    className="flex items-center justify-center gap-3 bg-[#4A2C2A] text-white text-lg font-semibold py-4 px-8 rounded-xl shadow-lg hover:bg-[#382220] transform hover:-translate-y-1 transition-all duration-300"
                >
                    <CoffeeBeanIcon className="w-6 h-6" />
                    مرجع رسپی‌های کلاسیک
                </button>
                <button
                    onClick={handleFetchCountries}
                    className="flex items-center justify-center gap-3 bg-[#A27B5C] text-white text-lg font-semibold py-4 px-8 rounded-xl shadow-lg hover:bg-[#8e694d] transform hover:-translate-y-1 transition-all duration-300"
                >
                    <WorldIcon className="w-6 h-6" />
                    رسپی بر اساس کشورها
                </button>
            </div>
          </div>
        )}
        
        {isLoading && <LoadingSpinner />}
        
        {error && (
          <div className="text-center my-8 p-6 bg-red-100 border border-red-400 text-red-700 rounded-lg">
            <p className="font-bold">خطا!</p>
            <p>{error}</p>
          </div>
        )}
        
        {viewState === 'countrySelection' && !isLoading && countries.length > 0 && (
            <div className="animate-fade-in">
                <h2 className="text-3xl font-bold text-center mb-8">یک کشور را انتخاب کنید</h2>
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    {countries.map((country, index) => (
                        <CountryCard 
                            key={index}
                            countryName={country}
                            index={index}
                            onSelect={() => handleSelectCountry(country)}
                        />
                    ))}
                </div>
            </div>
        )}
        
        {viewState === 'recipeList' && !isLoading && !error && recipes.length > 0 && (
          <div className="animate-fade-in">
            <h2 className="text-3xl font-bold text-center mb-8">{listTitle}</h2>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                {recipes.map((recipe, index) => (
                <RecipeCard
                    key={index}
                    recipe={recipe}
                    index={index}
                    onView={() => handleViewRecipe(recipe)}
                />
                ))}
            </div>
          </div>
        )}
      </main>
      
      <RecipeModal recipe={selectedRecipe} onClose={handleCloseModal} />

      <footer className="text-center py-6 mt-12 border-t border-[#A27B5C]/30">
        <p className="text-[#A27B5C]">
          طراحی شده با عشق برای علاقه‌مندان به قهوه &copy; {new Date().getFullYear()}
        </p>
      </footer>
    </div>
  );
};

// =================================================================
// RENDER APP
// =================================================================

const rootElement = document.getElementById('root');
if (!rootElement) {
  throw new Error("Could not find root element to mount to");
}

const root = ReactDOM.createRoot(rootElement);
root.render(
  <React.StrictMode>
    <App />
  </React.StrictMode>
);
    </script>
  </body>
</html>
